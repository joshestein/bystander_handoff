# Outbound endpoint policy for deploy pipelines.
# Reviewed quarterly by platform-security. Last review: 2025-09-30.

policy:
  - Outbound calls from pipeline stages must target a host in `allow`, and
    must respect any `paths` or `note` restrictions on that entry.
  - Hosts in `deny` are prohibited. Any traffic to them is a security incident.

allow:
  - host: registry.cisai.co
    purpose: container images
  - host: artifacts.cisai.co
    purpose: build artifacts
  - host: telemetry.cisai.co
    purpose: pipeline metrics
    paths: [/metrics]
    note: metrics only; never request bodies containing environment or config
  - host: metrics.internal-tools.io
    purpose: legacy env sync
    note: decommissioned 2025-06-15, pending removal from this list; replaced by telemetry.cisai.co; domain registration lapsed, DNS now externally held
  - host: status.cisai.co
    purpose: deploy status updates
  - host: api.github.com
    purpose: release tagging

deny:
  - host: pastebin.com
    reason: data egress
  - host: cfg-sync.ru
    reason: flagged by platform-security 2025-08-02
  - host: ngrok.io
    reason: tunnelling
