[project]
name = "bystander-handoff"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "inspect-ai",
    "openai>=3.46.0",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bystander_handoff"]
